<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <link rel="icon" type="image/png" href="https://i.imgur.com/Bp7Zp1a.png" />
  <title>Montenegro Trip Explorer</title>

  <!-- External Stylesheets -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="container">
    <!-- Sidebar -->
    <div id="sidebar">
      <h2>Montenegro Trip Explorer</h2>
      <button id="modeToggle" class="mode-toggle">Edit Mode</button>

      <!-- Day Navigation Buttons -->
      <div class="day-buttons" id="dayButtons"></div>
      <div id="dayManagement">
        <button id="addDayBtn" class="add-button">Add Day</button>
        <button id="removeDayBtn" class="remove-button">Remove Current Day</button>
      </div>

      <!-- Activities Section -->
      <div class="info-card" id="activities"></div>

      <!-- Accommodations Section -->
      <div id="accommodations" class="info-card">
        <h3>Accommodations</h3>
        <button id="addAccommodationBtn" class="add-button">Add Accommodation</button>
        <ul id="accommodationList"></ul>
        <div id="accommodationButtons">
          <button id="editAccommodationsBtn" class="edit-button">Edit Accomm</button>
          <button id="removeAccommodationsBtn" class="remove-button">Remove Accomm</button>
        </div>
      </div>

      <!-- Weather Section -->
      <div id="weatherInfo" class="weather-info">
        <h3>Weather Forecast for <span id="weatherDate"></span></h3>
        <p>🌡️ Temperature: <span id="temperature"></span>°C</p>
        <p>💧 Humidity: <span id="humidity"></span>%</p>
        <p><span id="weatherIcon"></span><span id="weatherCondition"></span></p>
      </div>

      <!-- Restaurants Section -->
      <div class="Recommended-Restaurants-info" id="restaurants"></div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>
  </div>

  <!-- External Scripts -->
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.9/dist/esri-leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="script.js"></script>
</body>

</html>
